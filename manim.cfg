# Manim lee este archivo cuando se ejecuta desde la carpeta raíz del proyecto.
[CLI]
background_color = #0F141A
# Videos terminados: videos/<archivo de la lección>/<calidad>/<Escena>.mp4
video_dir = ./videos/{module_name}/{quality}
# Caché y trozos intermedios (se pueden borrar sin perder nada).
media_dir = ./media
# Ruta corta a propósito: Windows limita las rutas a 260 caracteres y aquí hay
# nombres de archivo de 64 caracteres. Las calidades no chocan (el hash las distingue).
partial_movie_dir = {media_dir}/p/{scene_name}
# Sin limpieza de los archivos auxiliares de LaTeX: con varios renders en paralelo,
# la limpieza de uno borraba los archivos que otro estaba convirtiendo.
no_latex_cleanup = True
